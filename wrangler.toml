name = "docuhub"
main = "worker/index.ts"
compatibility_date = "2026-06-16"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
preview_urls = false

# DocuHub performs password hashing and document metadata processing in the
# Worker. The Standard (paid) Workers plan provides the required CPU budget;
# keep an explicit ceiling to contain unexpected usage and cost.
[limits]
cpu_ms = 30_000

[observability]
enabled = true
head_sampling_rate = 1

# Always create the Vite asset directory before Wrangler validates or deploys.
# This makes Cloudflare Builds safe even when no separate dashboard build
# command is configured.
[build]
command = "npm run build:pages"

# Static SPA assets built by `npm run build` (vite -> dist-pages). NOT
# ./public -- that directory only holds raw pre-build files (logo, icons)
# that vite copies verbatim into dist-pages; it has no index.html or built
# JS/CSS bundle on its own; pointing ASSETS at it directly serves a broken app.
[assets]
directory = "./dist-pages"
binding = "ASSETS"
not_found_handling = "single-page-application"
# Without this, Cloudflare checks the Assets binding BEFORE running the
# Worker's own fetch() handler for any request that looks like a page
# navigation (Sec-Fetch-Dest: document/iframe/frame) -- e.g. the <iframe
# src="/api/documents/:id/preview"> the document preview modal uses. Since
# that path has no file extension and matches no literal asset,
# not_found_handling="spa" serves index.html directly from the Assets layer,
# and worker/index.ts's isApiPath() routing never runs at all (confirmed via
# Cf-Cache-Status: HIT on the preview response -- it never reached the
# Worker). Regular fetch()/XHR calls aren't navigations, so they were
# unaffected. run_worker_first forces every request through fetch() first,
# so isApiPath() always gets to make the /api/* vs static-asset decision.
run_worker_first = true

# Nightly maintenance (see worker/index.ts's scheduled() handler): external
# backup first (server/backup.ts), then the Trash retention purge. The backup
# no-ops with a log line if the IDRIVE_* secrets below aren't set -- safe to
# leave enabled even before the feature is configured. Trash retention defaults
# to 30 days; set TRASH_RETENTION_DAYS = "0" in [vars] to disable purging.
[triggers]
crons = ["0 2 * * *"]

[vars]
NODE_ENV = "production"
# APP_URL is intentionally unset while DocuHub runs on the temporary
# https://docuhub.<account>.workers.dev hostname: the account subdomain is not
# known until the first deployment, and a stale value here breaks the origin
# check and every generated link (OAuth callback, password reset, invites,
# share links). With it unset the server derives the origin from the request
# host, which it only trusts for *.workers.dev (see appOrigin() in server.ts).
# Set APP_URL = "https://avdpdocs.org" again together with the [[routes]]
# custom-domain entry when that domain is added to Cloudflare.
# The project URL is public information (it's visible to every client);
# only the service-role key must stay a secret.
SUPABASE_URL = "https://vwpibqvwzvqccoqceumv.supabase.co"
# Admin-created accounts must use this domain; enforced in sanitizeUserPayload()
# in server.ts. Not a secret -- just a policy value.
ALLOWED_EMAIL_DOMAIN = "avdp.org.sl"
# Trash auto-purge is switched off for now: documents stay in Trash until an
# Admin purges them by hand. Set this to "30" (or any positive number of days)
# once the existing Trash has been reviewed -- the first nightly run after that
# removes everything already past the window, dated from migration 0007's
# backfill, so review before switching it on rather than after.
TRASH_RETENTION_DAYS = "0"

# `body-parser` pulls in iconv-lite, whose dynamic `require('streams')` breaks
# under the Workers nodejs_compat shim. Swap it for a TextDecoder-backed stub
# that handles the UTF-8 / Latin-1 charsets real clients actually send.
[alias]
"iconv-lite" = "./worker/iconv-lite-stub.js"

# Required secrets — set in the Cloudflare dashboard (Workers & Pages →
# docuhub → Settings → Variables and Secrets → Add → type "Secret") or with
# `wrangler secret put NAME`. NEVER commit secret values to this file: the
# repo is readable by anyone with repo access and git history is forever.
#   SUPABASE_SERVICE_ROLE_KEY    Supabase service-role key (durable persistence + storage)
#   INITIAL_ADMIN_PASSWORD       Required only for a fresh database whose seeded Admin has no password
#   SESSION_SECRET               Optional — overrides the cookie HMAC secret
#   RESEND_API_KEY               Optional — enables email notifications
#   RESEND_SHARE_TEMPLATE_ID     Optional — Resend dashboard template ID used for share/
#                                 share-link emails instead of this codebase's built-in HTML
#   GEMINI_API_KEY               Optional — AI OCR/tagging (falls back to heuristics)
#   IDRIVE_ACCESS_KEY_ID         Optional — enables external backups (Settings → Backup, + nightly cron)
#   IDRIVE_SECRET_ACCESS_KEY     Optional — pairs with the access key above
#   IDRIVE_ENDPOINT              Optional — e.g. https://<id>.idrivee2-<region>.com (S3-compatible; also works with Backblaze/Wasabi/R2/MinIO)
#   IDRIVE_BUCKET                Optional — destination bucket name
